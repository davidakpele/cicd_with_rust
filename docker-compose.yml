version: "3.9"

services:
  app:
    build: .
    container_name: cicd-service
    ports:
      - "8022:8022"   # Rust deployment service API
    env_file:
      - .env          # Load environment variables including GitHub credentials
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - cicd-net
    volumes:
      - deployments_data:/app/deployments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8022/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres_db:
    image: postgres:latest
    container_name: cicd-net-db
    restart: always
    environment:
      POSTGRES_DB: ci_cd_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ci_cd_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:latest
    container_name: cicd-nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d
      - deployments_data:/app/deployments  # Serve user deployments
    networks:
      - cicd-net

volumes:
  pg_data:
  deployments_data:

networks:
  cicd-net:
    driver: bridge
