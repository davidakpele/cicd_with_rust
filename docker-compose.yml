volumes:
  pg_data:
  deployments_data:

networks:
  cicd-net:
    driver: bridge

services:
  # Main Application
  app:
    build: .
    container_name: cicd-service
    ports:
      - "8022:8022"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:root@postgres_db:5432/ci_cd_pipeline
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - cicd-net
    volumes:
      - deployments_data:/deployments
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8022/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Database
  postgres_db:
    image: postgres:13
    container_name: cicd-net-db
    restart: always
    environment:
      - POSTGRES_DB=ci_cd_pipeline
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ci_cd_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reverse Proxy (Nginx)
  # Reverse Proxy (Nginx)
  reverse-proxy:
    image: nginx:alpine
    container_name: cicd-nginx
    ports:
      - "80:80"
    volumes:
      # Mount the entire 'nginx' directory.
      # This fixes the file-vs-directory conflict on Windows/macOS.
      - ./nginx:/etc/nginx
      # This volume mount for dynamic configs is correct and should remain.
      - deployments_data:/etc/nginx/conf.d
    networks:
      - cicd-net
    depends_on:
      - app