<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Use a UUID library for unique IDs, as crypto.randomUUID() isn't available everywhere
        const generateId = () => {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        // --- In-memory Data Store ---
        let repos = [];
        let jobs = [];

        // --- UI Element References ---
        let loadingOverlay;
        let repoListElement;
        let jobListElement;
        let addRepoBtn;
        let liveLogsContainer;
        let liveLogsContent;
        let messageBox;

        // --- Data Manipulation Functions ---
        const addRepo = (repo) => {
            showLoading(true);
            const newRepo = {
                id: generateId(),
                ...repo,
                created_at: new Date(),
            };
            repos.push(newRepo);
            renderRepos();
            showLoading(false);
        };

        const addJob = (repo) => {
            showLoading(true);
            const newJob = {
                id: generateId(),
                repo_id: repo.id,
                commit_hash: 'mock-commit-hash-' + generateId().substring(0, 8),
                status: 'Pending',
                created_at: new Date(),
                started_at: null,
                finished_at: null,
                logs: [],
            };
            jobs.unshift(newJob); // Add to the beginning to show most recent first
            renderJobs();
            // Clear and show the new logs container
            liveLogsContainer.classList.remove('hidden');
            liveLogsContent.innerHTML = '';
            
            showLoading(false);
            // Simulate the backend worker running the job
            simulateJobWorker(newJob.id);
        };

        const simulateJobWorker = (jobId) => {
            let job = jobs.find(j => j.id === jobId);
            if (!job) return;
            
            // Phase 1: Running
            job.status = 'Running';
            job.started_at = new Date();
            renderJobs();

            setTimeout(() => {
                job.logs.push({ line: "Cloning repository...", created_at: new Date().getTime() });
                renderLogs(job);
            }, 1000);

            setTimeout(() => {
                job.logs.push({ line: "Building project...", created_at: new Date().getTime() });
                renderLogs(job);
            }, 2500);
            
            setTimeout(() => {
                job.logs.push({ line: "Running tests...", created_at: new Date().getTime() });
                renderLogs(job);
            }, 3500);

            // Phase 2: Success or Failure (randomly)
            setTimeout(() => {
                const isSuccess = Math.random() > 0.3; // 70% success chance
                
                if (isSuccess) {
                    job.logs.push({ line: "All tests passed. Job finished successfully.", created_at: new Date().getTime() });
                    job.status = 'Success';
                    job.finished_at = new Date();
                } else {
                    job.logs.push({ line: "Tests failed. Job finished with errors.", created_at: new Date().getTime() });
                    job.status = 'Failed';
                    job.finished_at = new Date();
                }
                renderJobs();
                renderLogs(job);
            }, 4500);
        };
        
        // --- UI Rendering Functions ---
        const renderRepos = () => {
            repoListElement.innerHTML = '';
            if (repos.length === 0) {
                repoListElement.innerHTML = '<p class="text-gray-500 italic">No repositories added yet. Add one to get started!</p>';
            }
            repos.forEach(repo => {
                const repoCard = document.createElement('div');
                repoCard.className = 'bg-gray-100 dark:bg-gray-800 p-4 rounded-xl shadow-md flex justify-between items-center transition-all hover:bg-gray-200 dark:hover:bg-gray-700';
                repoCard.innerHTML = `
                    <div>
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white">${repo.name}</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 truncate w-64">${repo.url}</p>
                        <p class="text-xs text-blue-500 dark:text-blue-400">Branch: ${repo.branch}</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-full text-sm transition-colors shadow-lg run-job-btn" data-repo-id="${repo.id}">
                        Run Job
                    </button>
                `;
                repoListElement.appendChild(repoCard);
            });

            // Attach event listeners for run job buttons
            document.querySelectorAll('.run-job-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    const repoId = event.target.dataset.repoId;
                    const repo = repos.find(r => r.id === repoId);
                    if (repo) {
                        addJob(repo);
                    }
                });
            });
        };

        const renderJobs = () => {
            jobListElement.innerHTML = '';
            if (jobs.length === 0) {
                jobListElement.innerHTML = '<p class="text-gray-500 italic">No jobs have been run yet.</p>';
            }
            jobs.forEach(job => {
                const statusColor = getStatusColor(job.status);
                const jobCard = document.createElement('div');
                jobCard.className = 'bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md flex justify-between items-center transition-all hover:bg-gray-100 dark:hover:bg-gray-700';
                
                // Add a visual indicator for the running job
                if (job.status === 'Running') {
                    jobCard.classList.add('animate-pulse');
                    jobCard.style.boxShadow = `0 0 10px 2px ${statusColor}`;
                }
                
                jobCard.innerHTML = `
                    <div class="flex-grow">
                        <div class="font-bold text-gray-900 dark:text-white flex items-center">
                            <span class="w-2.5 h-2.5 rounded-full mr-2" style="background-color: ${statusColor};"></span>
                            <span>Job: ${job.commit_hash}</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Status: <span class="font-semibold" style="color: ${statusColor};">${job.status}</span></p>
                        <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">
                            Started: ${job.started_at ? new Date(job.started_at).toLocaleString() : 'N/A'}
                        </p>
                    </div>
                `;
                jobListElement.appendChild(jobCard);
            });
        };
        
        const renderLogs = (job) => {
            liveLogsContent.innerHTML = ''; // Clear logs for the new job
            if (job.logs && job.logs.length > 0) {
                job.logs.forEach(log => {
                    const logLine = document.createElement('p');
                    logLine.className = 'text-xs md:text-sm text-gray-200 font-mono break-all';
                    logLine.textContent = `[${new Date(log.created_at).toLocaleTimeString()}] ${log.line}`;
                    liveLogsContent.appendChild(logLine);
                });
            } else {
                liveLogsContent.innerHTML = '<p class="text-center text-gray-500 italic">Starting job...</p>';
            }
            liveLogsContent.scrollTop = liveLogsContent.scrollHeight; // Auto-scroll to the bottom
        };

        const getStatusColor = (status) => {
            switch (status) {
                case 'Success':
                    return '#10B981'; // Green-500
                case 'Running':
                    return '#F59E0B'; // Amber-500
                case 'Pending':
                    return '#6B7280'; // Gray-500
                case 'Failed':
                    return '#EF4444'; // Red-500
                default:
                    return '#9CA3AF'; // Gray-400
            }
        };

        const showLoading = (show) => {
            loadingOverlay.classList.toggle('hidden', !show);
        };
        
        const showMessage = (message, isError = false) => {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden');
            if (isError) {
                messageBox.classList.remove('bg-green-500');
                messageBox.classList.add('bg-red-500');
            } else {
                messageBox.classList.remove('bg-red-500');
                messageBox.classList.add('bg-green-500');
            }
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        };

        const simulateGithubOAuth = () => {
            // Simulate redirect to GitHub
            showLoading(true);
            setTimeout(() => {
                const mockCode = 'gho_mock_auth_code_' + generateId().substring(0, 8);
                // Simulate the browser being redirected back with a code
                history.pushState({}, '', `?code=${mockCode}`);
                window.location.reload(); // Reload to simulate the full page load
            }, 2000);
        };
        
        // --- Event Listeners (now wait for the window to load) ---
        window.addEventListener('load', () => {
            // Get all element references
            loadingOverlay = document.getElementById('loading-overlay');
            repoListElement = document.getElementById('repo-list');
            jobListElement = document.getElementById('job-list');
            addRepoBtn = document.getElementById('add-repo-btn');
            liveLogsContainer = document.getElementById('live-logs-container');
            liveLogsContent = document.getElementById('live-logs-content');
            messageBox = document.getElementById('message-box');

            // Check for simulated GitHub callback
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');
            
            if (authCode) {
                showLoading(true);
                // Simulate a backend call to exchange the code for a token
                showMessage("Successfully authenticated with GitHub. Fetching repository data...", false);
                
                setTimeout(() => {
                    const mockRepoName = `simulated-github-repo-${generateId().substring(0, 6)}`;
                    addRepo({ 
                        name: `github/${mockRepoName}`, 
                        url: `https://github.com/simulated-user/${mockRepoName}`, 
                        branch: 'main' 
                    });
                    showMessage("Repository imported successfully!", false);
                    history.replaceState({}, document.title, window.location.pathname);
                }, 2500);
            }

            // Attach event listeners
            addRepoBtn.addEventListener('click', () => {
                simulateGithubOAuth();
            });

            // Initial render
            renderRepos();
            renderJobs();
        });
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.5);
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 10px 2px rgba(245, 158, 11, 0.7);
            }
            50% {
                box-shadow: 0 0 10px 2px rgba(245, 158, 11, 0.3);
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased leading-relaxed">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-75 hidden">
        <svg class="animate-spin h-10 w-10 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>
    
    <!-- Message Box -->
    <div id="message-box" class="fixed top-4 left-1/2 -translate-x-1/2 py-3 px-6 rounded-full shadow-lg text-sm text-white font-semibold transition-all duration-300 z-50 hidden">
        Message
    </div>

    <div class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
        <header class="flex flex-col sm:flex-row items-center justify-between mb-8 pb-4 border-b border-gray-200 dark:border-gray-800">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">CI/CD Dashboard</h1>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage your repositories and monitor your build jobs.</p>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Repositories Section -->
            <div class="lg:col-span-1 bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">Repositories</h2>
                    <button id="add-repo-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-full text-sm transition-colors shadow-lg">
                        Add New Repo
                    </button>
                </div>
                <div id="repo-list" class="space-y-4 flex-grow overflow-y-auto">
                    <!-- Repo cards will be rendered here by JS -->
                </div>
            </div>

            <!-- Recent Jobs Section -->
            <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">Recent Jobs</h2>
                </div>
                <div id="job-list" class="space-y-4 flex-grow">
                    <!-- Job cards will be rendered here by JS -->
                </div>
                
                <!-- Live Logs Container -->
                <div id="live-logs-container" class="mt-6 hidden">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Live Logs</h3>
                    <div id="live-logs-content" class="bg-gray-900 p-4 rounded-xl text-gray-200 font-mono text-sm leading-relaxed whitespace-pre-wrap max-h-60 overflow-y-auto">
                        <!-- Logs will be displayed here -->
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
