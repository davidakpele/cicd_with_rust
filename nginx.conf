# nginx/nginx.conf
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Main server block for the CI/CD application's API and UI.
    server {
        listen 80;
        server_name localhost;

        location / {
            # Proxy directly to the main app container by its service name
            proxy_pass http://app:8022;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Referer $http_referer;
            proxy_set_header Authorization $http_authorization;
        }
    }

    # This is the most important part. It includes new site configurations created by your Rust app.
    # Your Rust app will write files like "my-site.conf" into this directory.
    include /etc/nginx/conf.d/*.conf;
}